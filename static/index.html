<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 flex items-center justify-between shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <button class="hover:bg-blue-700 p-1 rounded-full transition-colors">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="relative">
                <img src="https://ui-avatars.com/api/?name=E-bot&background=random" alt="E-bot" class="w-10 h-10 rounded-full border-2 border-white">
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></div>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">E-bot</h1>
                <p class="text-xs text-blue-100">online</p>
            </div>
        </div>
        <div class="relative">
            <button id="dropdown-btn" class="hover:bg-blue-700 p-1 rounded-full transition-colors">
                <i data-lucide="chevron-down"></i>
            </button>
            <!-- Dropdown Menu -->
            <div id="products-dropdown" class="hidden absolute right-0 mt-2 w-64 bg-white text-gray-800 rounded-md shadow-lg z-50 border border-gray-200 overflow-hidden">
                <div class="p-3 font-bold border-b bg-gray-50 text-sm text-gray-700">Suggested Products</div>
                <div id="products-list" class="max-h-60 overflow-y-auto">
                    <!-- Product items will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </header>

    <!-- Chat Window -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-6">
        <!-- Date Separator -->
        <div class="text-center text-xs text-gray-500 my-4">
            <span id="current-date"></span>
        </div>
        <!-- Messages will be appended here -->
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t p-4 shrink-0">
        <div class="max-w-4xl mx-auto flex items-center space-x-3">
            <input type="text" id="user-input"
                   class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                   placeholder="Type your message...">
            <button id="send-btn" class="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700 transition-colors shadow-sm">
                <i data-lucide="arrow-up"></i>
            </button>
        </div>
    </footer>

    <script src="/static/js/chat.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
